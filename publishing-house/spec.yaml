project:
  slug: "container-management-demo"
  owner_email: "pbravoco@redhat.com"
  content_type: "demo"
  deployment_mode: "rhdp_published"
  initiative_key: "none"
  showroom_type: "classic"
  intake_type: "migration"
  automation_type: "both"
  description: "This demo is designed to help you understand the key features and capabilities of OpenShift as a Container Management Platform."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1351"
  workflow_id: "872d5db8-66ee-47ce-9f30-7924e92c3b40"

spec:
  title: "Container Management Demo"
  learning_objectives:
    - "Demonstrate OpenShift Console capabilities across multiple perspectives, including topology views, the embedded web terminal, the Software Catalog, quick starts, and user management"
    - "Deploy applications on OpenShift using Operators (Crunchy PostgreSQL), Helm Charts (SQL Server), and existing containerized workloads (Online Boutique)"
    - "Demonstrate OpenShift security controls by walking through Security Context Constraints, Role-Based Access Control, and network policy enforcement"
    - "Demonstrate cluster lifecycle operations including a full-stack OTA upgrade, self-healing through continuous reconciliation, and AI-assisted troubleshooting with OpenShift Lightspeed"
    - "Observe and correlate cluster signals using Prometheus monitoring, LokiStack centralized logging, and the Troubleshooting Panel"
  modules:
    - id: module-01
      title: "Console Overview"
      duration_min: 45
      status: not_started
    - id: module-02
      title: "Deploying Applications"
      duration_min: 45
      status: not_started
    - id: module-03
      title: "Secure by Default"
      duration_min: 45
      status: not_started
    - id: module-04
      title: "Cluster Operations"
      duration_min: 45
      status: not_started
    - id: module-05
      title: "Observability"
      duration_min: 55
      status: not_started
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: ""               # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.20"                # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: "sno"                # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "none"             # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products:
      - "Cluster Observability Operator 1.x (Technology Preview)"
    non_ga_access_plan: "Available via standard OperatorHub channel"
    external_services:
      - "LLM provider API (OpenAI, Azure OpenAI, or IBM watsonx) — required for OpenShift Lightspeed"
      - "mpbravo.github.io — custom Helm repositories (SQL Server, MinIO)"
      - "Red Hat OSUS — cluster update graph"
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: null
  audience: "intermediate"   # beginner | intermediate | advanced


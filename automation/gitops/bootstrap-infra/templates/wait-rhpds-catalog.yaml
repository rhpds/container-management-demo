# Generated from https://github.com/rhpds/rhdp-gitops-patterns/examples/agentops-lab
# Sync hook that blocks Subscriptions (wave -2) until the pinned CatalogSource is READY.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wait-rhpds-catalog
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wait-rhpds-catalog
  namespace: openshift-marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
rules:
  - apiGroups: ["operators.coreos.com"]
    resources: ["catalogsources"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wait-rhpds-catalog
  namespace: openshift-marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wait-rhpds-catalog
subjects:
  - kind: ServiceAccount
    name: wait-rhpds-catalog
    namespace: openshift-gitops
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-rhpds-catalog
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    spec:
      serviceAccountName: wait-rhpds-catalog
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: registry.redhat.io/openshift4/ose-cli:v4.14
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for CatalogSource rhpds-redhat-operators READY"
              for i in $(seq 1 90); do
                state=$(oc get catalogsource rhpds-redhat-operators -n openshift-marketplace \
                  -o jsonpath='{.status.connectionState.lastObservedState}' 2>/dev/null || true)
                echo "attempt $i state=$state"
                if [ "$state" = "READY" ]; then
                  echo "CatalogSource READY"
                  exit 0
                fi
                sleep 10
              done
              echo "ERROR: timed out waiting for CatalogSource READY"
              exit 1

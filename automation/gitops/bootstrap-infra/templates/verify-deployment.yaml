# Post-sync verification matching the 00-initial-setup.adoc final checklist.
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-deployment
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: openshift-gitops-argocd-application-controller
      restartPolicy: OnFailure
      containers:
        - name: verify
          image: registry.redhat.io/openshift4/ose-cli:v4.14
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "=== Checklist: verifying deployment ==="

              echo "[1/6] User Workload Monitoring pods..."
              oc wait pod --for=condition=Ready -n openshift-user-workload-monitoring \
                -l app.kubernetes.io/name=prometheus --timeout=300s

              echo "[2/6] MinIO pod..."
              oc wait pod --for=condition=Ready -n {{ .Values.minio.namespace }} \
                -l app=minio --timeout=180s

              echo "[3/6] LokiStack pods..."
              oc wait pod --for=condition=Ready -n {{ .Values.logging.namespace }} \
                -l app.kubernetes.io/name=lokistack --timeout=300s || true

              echo "[4/6] Log collector DaemonSet..."
              for i in $(seq 1 60); do
                count=$(oc get pods -n {{ .Values.logging.namespace }} \
                  -l app.kubernetes.io/name=collector --no-headers 2>/dev/null | wc -l)
                if [ "$count" -gt 0 ]; then
                  echo "Collector pods found: $count"
                  break
                fi
                echo "attempt $i — waiting for collector pods..."
                sleep 10
              done

              echo "[5/6] UIPlugins..."
              for plugin in monitoring logging troubleshooting-panel; do
                for i in $(seq 1 30); do
                  status=$(oc get uiplugin "$plugin" \
                    -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null || true)
                  if [ "$status" = "True" ]; then
                    echo "UIPlugin $plugin: Available"
                    break
                  fi
                  echo "attempt $i — $plugin status=$status"
                  sleep 10
                done
              done

              echo "[6/6] Web Terminal Operator..."
              oc get csv -n openshift-operators -l operators.coreos.com/web-terminal.openshift-operators \
                --no-headers 2>/dev/null | head -1 || echo "Web Terminal CSV not yet ready"

              echo "=== Verification complete ==="

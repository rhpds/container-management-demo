apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: loki-operator
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  channel: {{ .Values.logging.loki.channel }}
  installPlanApproval: Automatic
  name: loki-operator
  source: {{ .Values.logging.loki.source }}
  sourceNamespace: {{ .Values.logging.loki.sourceNamespace }}

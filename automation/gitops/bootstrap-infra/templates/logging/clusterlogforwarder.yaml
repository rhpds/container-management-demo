# Generated from https://github.com/rhpds/rhdp-gitops-patterns
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: instance
  namespace: {{ .Values.logging.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  serviceAccount:
    name: logging-collector
  outputs:
    - name: default-loki
      type: lokiStack
      lokiStack:
        target:
          name: logging-loki
          namespace: {{ .Values.logging.namespace }}
        authentication:
          token:
            from: serviceAccount
      tls:
        ca:
          configMapName: lokistack-gateway-ca-bundle
          key: service-ca.crt
  pipelines:
    - name: send-app-and-infra-logs
      inputRefs: ["application", "infrastructure"]
      outputRefs: ["default-loki"]

apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: logging-loki
  namespace: {{ .Values.logging.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  size: {{ .Values.logging.lokiStack.size }}
  storage:
    schemas:
      - version: {{ .Values.logging.lokiStack.schemaVersion }}
        effectiveDate: {{ .Values.logging.lokiStack.schemaEffectiveDate | quote }}
    secret:
      name: logging-loki-s3
      type: s3
  {{- if .Values.logging.storageClassName }}
  storageClassName: {{ .Values.logging.storageClassName }}
  {{- end }}
  tenants:
    mode: openshift-logging

# Generated from https://github.com/rhpds/rhdp-gitops-patterns
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-logging-prerequisites
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 30
  template:
    spec:
      serviceAccountName: bootstrap-jobs
      restartPolicy: OnFailure
      containers:
        - name: verify
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          command:
            - /bin/bash
            - -c
            - |
              NS={{ .Values.logging.namespace | quote }}

              echo "--- Operator readiness ---"

              echo "Waiting for Loki Operator CSV Succeeded in openshift-operators-redhat..."
              until [ "$(oc get csv -n openshift-operators-redhat \
                -l operators.coreos.com/loki-operator.openshift-operators-redhat="" \
                -o jsonpath='{.items[0].status.phase}' 2>/dev/null)" = "Succeeded" ]; do
                echo "  waiting..."
                sleep 15
              done
              echo "  OK"

              echo "Waiting for Cluster Logging CSV Succeeded in $NS..."
              until [ "$(oc get csv -n "$NS" \
                -l operators.coreos.com/cluster-logging."$NS"="" \
                -o jsonpath='{.items[0].status.phase}' 2>/dev/null)" = "Succeeded" ]; do
                echo "  waiting..."
                sleep 15
              done
              echo "  OK"

              echo "--- CRDs ---"

              echo "Waiting for ClusterLogForwarder CRD..."
              until oc get crd clusterlogforwarders.observability.openshift.io > /dev/null 2>&1; do
                sleep 10
              done
              echo "  OK"

              echo "--- RBAC ---"

              echo "Checking ServiceAccount logging-collector..."
              until oc get sa logging-collector -n "$NS" > /dev/null 2>&1; do
                echo "  waiting..."
                sleep 5
              done
              echo "  OK"

              for cr in collect-application-logs collect-infrastructure-logs logging-collector-logs-writer; do
                echo "Checking ClusterRole $cr..."
                until oc get clusterrole "$cr" > /dev/null 2>&1; do
                  echo "  waiting..."
                  sleep 5
                done
                echo "  OK"
              done

              for crb in logging-collector-application-logs logging-collector-infrastructure-logs logging-collector-logs-writer; do
                echo "Checking ClusterRoleBinding $crb..."
                until oc get clusterrolebinding "$crb" > /dev/null 2>&1; do
                  echo "  waiting..."
                  sleep 5
                done
                echo "  OK"
              done

              echo "--- LokiStack ---"

              echo "Checking CA bundle has certificate data..."
              until oc get cm lokistack-gateway-ca-bundle -n "$NS" -o jsonpath='{.data.service-ca\.crt}' 2>/dev/null | grep -q "BEGIN CERTIFICATE"; do
                echo "  waiting for service-ca operator to inject certificate..."
                sleep 10
              done
              echo "  OK"

              echo "Waiting for LokiStack logging-loki to become Ready..."
              until [ "$(oc get lokistack logging-loki -n "$NS" \
                -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)" = "True" ]; do
                echo "  waiting..."
                sleep 15
              done
              echo "  OK"

              echo "All ClusterLogForwarder prerequisites are ready"

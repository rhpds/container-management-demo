apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-logging
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  channel: {{ .Values.logging.operator.channel }}
  installPlanApproval: Automatic
  name: cluster-logging
  source: {{ .Values.logging.operator.source }}
  sourceNamespace: {{ .Values.logging.operator.sourceNamespace }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: bootstrap-jobs
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bootstrap-jobs-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "configmaps", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["catalogsources", "subscriptions", "clusterserviceversions"]
    verbs: ["get", "list"]
  - apiGroups: ["loki.grafana.com"]
    resources: ["lokistacks"]
    verbs: ["get"]
  - apiGroups: ["observability.openshift.io"]
    resources: ["uiplugins", "clusterlogforwarders"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bootstrap-jobs-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bootstrap-jobs-reader
subjects:
  - kind: ServiceAccount
    name: bootstrap-jobs
    namespace: openshift-operators
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-loki-crd
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 30
  template:
    spec:
      serviceAccountName: bootstrap-jobs
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for CRD: lokistacks.loki.grafana.com"
              until oc get crd lokistacks.loki.grafana.com > /dev/null 2>&1; do
                sleep 10
              done
              echo "CRD available: lokistacks.loki.grafana.com"

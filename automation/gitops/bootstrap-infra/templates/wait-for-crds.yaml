    resources: ["clusterrolebindings"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bootstrap-jobs-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bootstrap-jobs-reader
subjects:
  - kind: ServiceAccount
    name: bootstrap-jobs
    namespace: openshift-operators
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-crds
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 30
  template:
    spec:
      serviceAccountName: bootstrap-jobs
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          command:
            - /bin/bash
            - -c
            - |
              CRDS="lokistacks.loki.grafana.com clusterlogforwarders.observability.openshift.io uiplugins.observability.openshift.io"
              for crd in $CRDS; do
                echo "Waiting for CRD: $crd"
                until oc get crd "$crd" > /dev/null 2>&1; do
                  sleep 10
                done
                echo "CRD available: $crd"
              done
              echo "All operator CRDs are available"

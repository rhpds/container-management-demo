apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-catalog
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 30
  template:
    spec:
      serviceAccountName: bootstrap-jobs
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for CatalogSource rhpds-redhat-operators to become READY..."
              until [ "$(oc get catalogsource rhpds-redhat-operators \
                -n openshift-marketplace \
                -o jsonpath='{.status.connectionState.lastObservedState}' 2>/dev/null)" = "READY" ]; do
                echo "  not ready yet — retrying in 10s..."
                sleep 10
              done
              echo "CatalogSource is READY"

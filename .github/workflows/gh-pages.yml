name: GitHub Pages — Container Management Demo

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'site.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gh-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'content/**'
      - 'site.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Antora and extensions
        run: |
          npm install
          npm install -g \
            @antora/cli@3.1 \
            @antora/site-generator@3.1 \
            @sntke/antora-mermaid-extension@0.0.9 \
            @antora/lunr-extension \
            @andrew-jones/antora-tabs-extension@1.0.0

      - name: Configure site.yml for GitHub Pages
        run: |
          # Stable public UI bundle for GH Pages builds
          sed -i 's|url: .*ui-bundle.zip|url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/showroom-template/ui-bundle.zip|' site.yml

          # Canonical site URL for this repository
          if grep -q '^  url:' site.yml; then
            sed -i 's|^  url:.*|  url: https://rhpds.github.io/container-management-demo|' site.yml
          else
            sed -i '/^site:/a\  url: https://rhpds.github.io/container-management-demo' site.yml
          fi

          # Add Lunr search for the published preview
          sed -i "/^output:/i\\    - require: '@antora/lunr-extension'\\n      index_by_heading: true" site.yml

          echo "Effective site.yml:"
          cat site.yml

      - name: Generate Antora site
        run: antora --fetch site.yml

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
